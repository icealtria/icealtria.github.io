# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: icealtria/blog

media_folder: /content/diary/media
public_folder: /public

collections:
  - name: diary
    label: Diary
    label_singular: Diary
    folder: /content/diary
    slug: '{{year}}-{{month}}-{{day}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: pubDate, widget: datetime, type: date }
      - { label: Tags, name: tags, widget: list }
      - { label: Body, name: body, widget: richtext }
